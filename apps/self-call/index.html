<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Self-call HEMA scoring application for keeping score during matches">
  <meta name="theme-color" content="#007bff">
  <title>HEMA Self Call</title>
  
  <!-- PWA meta tags -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HEMA Self Call">
  
  <!-- Accessibility -->
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="loading__spinner"></div>
      <div class="loading__text">Loading HEMA Self Call...</div>
    </div>
  </div>
  
  <style>
    /* Loading screen styles */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #404040;
      background: #fafafa;
    }
    
    .loading__spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e5e5;
      border-left-color: #007bff;
      border-radius: 50%;
      animation: loading-spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    
    .loading__text {
      font-size: 1.125rem;
      font-weight: 500;
    }
    
    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    @media (prefers-color-scheme: dark) {
      .loading {
        color: #f5f5f5;
        background: #171717;
      }
      .loading__spinner {
        border-color: #404040;
        border-left-color: #007bff;
      }
    }
  </style>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
