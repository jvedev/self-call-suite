<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Timer Component Test</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
        }

        .match-view{
            height: 100vh;
            width: 100vw;
            max-width: 600px;
            display:grid;
            grid-template-rows: 27vh 73vh;

            timer-component {
                display: block;
                font-size: 10rem;
            }

            score-component {
                min-height: 0;
                min-width: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
                display: block;

            }
        }

        warning-component{
            display:none
        }

    </style>
</head>
<body>

    <div class="match-view">
        <timer-component id="timer" mode="edit"></timer-component>
        <score-component id="score-component"></score-component>
    </div>

<!--    <warning-component style="display:none" id="warning"></warning-component>-->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
