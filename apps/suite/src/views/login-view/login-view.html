<div class="login-container">
  <div class="login-box">
    <h1>Suite</h1>
    <p class="subtitle">Tournament Management System</p>

    <form class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="error-message" style="display: none;"></div>

      <button type="submit" class="submit-btn primary">Sign In</button>
    </form>

    <div class="footer">
      <p>Don't have an account? <button class="switch-btn" type="button">Sign Up</button></p>
    </div>
  </div>
</div>
