<div class="register-container">
  <div class="register-box">
    <h1>Suite</h1>
    <p class="subtitle">Create Your Account</p>

    <form class="register-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="John Doe"
          required
        />
      </div>

      <div class="form-group">
        <label for="alias">Alias</label>
        <input
          type="text"
          id="alias"
          placeholder="JohnD"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="error-message" style="display: none;"></div>

      <button type="submit" class="submit-btn primary">Sign Up</button>
    </form>

    <div class="footer">
      <p>Already have an account? <button class="switch-btn" type="button">Sign In</button></p>
    </div>
  </div>
</div>
