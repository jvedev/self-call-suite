<div class="container">
  <div class="match-header">
    <h2>Match in Progress</h2>
    <div class="competitors">
      <span class="red-competitor" id="red-name"></span>
      <span class="vs">vs</span>
      <span class="blue-competitor" id="blue-name"></span>
    </div>
  </div>
  <div class="timer-section">
    <div id="timer" class="timer timer-normal">00:00</div>
    <div class="timer-controls">
      <button id="pause-btn" class="btn">Pause</button>
    </div>
  </div>
  <div class="scoring-section">
    <div class="score-display">
      <div class="red-score"><h3>Red: <span id="red-score">0</span></h3></div>
      <div class="blue-score"><h3>Blue: <span id="blue-score">0</span></h3></div>
    </div>
    <div class="action-buttons">
      <button id="hit-btn" class="btn btn-primary">Hit</button>
      <button id="warning-btn" class="btn">Warning</button>
      <button id="timeout-btn" class="btn">Timeout</button>
      <button id="adjust-time-btn" class="btn">Adjust Time</button>
      <button id="end-match-btn" class="btn btn-danger">End Match</button>
    </div>
  </div>
</div>
