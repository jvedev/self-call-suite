<div class="container">
  <h2>New Match</h2>
  <form id="new-match-form">
    <div class="form-field">
      <label for="red-fighter" class="form-label">Red Fighter</label>
      <input type="text" id="red-fighter" class="form-input" placeholder="Enter red fighter name" required />
    </div>
    <div class="form-field">
      <label for="blue-fighter" class="form-label">Blue Fighter</label>
      <input type="text" id="blue-fighter" class="form-input" placeholder="Enter blue fighter name" required />
    </div>
    <div id="error-message" class="error-message" style="display: none;"></div>
    <div class="button-group">
      <button type="submit" class="btn btn-primary">Start Match</button>
      <button type="button" id="back-btn" class="btn">Back</button>
    </div>
  </form>
</div>
