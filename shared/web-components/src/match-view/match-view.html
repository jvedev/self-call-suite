<div class="placeholder">
    <div class="main-view">
        <timer-component id="timer" mode="edit"></timer-component>
        <div class="players">
            <div class="player red">
                <div class="score">0</div>
                <div class="name"></div>
            </div>
            <div class="player blue">
                <div class="score">0</div>
                <div class="name"></div>
            </div>
        </div>
        <button class="button green" id="hit">hit</button>
        <button class="button red" id="warning">warning</button>
        <button class="button orange" id="history">Match history</button>
        <div class="bottom-buttons">
            <button class="back button blue" id="back" >Back</button>

            <button class="button blue" id="extent">Extent</button>
            <button class="button red" id="stop">Stop</button>
        </div>
    </div>

    <match-history id="match-history"></match-history>
    <score-component id="score-component"></score-component>
    <warning-component id="warning"></warning-component>
    <call-out id="call-out"></call-out>
</div>
