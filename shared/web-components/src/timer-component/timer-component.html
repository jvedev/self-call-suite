<div class="placeholder" mode="stop">
    <div class="minutes clock">20</div>
    <div class="adjuster adjust-minutes">
        <button class="increase">▲</button>
        <button class="decrease">▼</button>
    </div>
    <div class="divider clock">:</div>
    <div class="seconds clock">34</div>
    <div class="adjuster adjust-seconds">
        <button class="increase">▲</button>
        <button class="decrease">▼</button>
    </div>
    <button class="update">OK</button>
    <div class="controls">
        <button class="start">Start</button>
        <button class="pause">Pause</button>
        <button class="resume">Resume</button>
        <button class="edit">Edit</button>
    </div>
</div>
